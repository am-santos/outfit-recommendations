[project]
name = "outfit-recommendations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "django>=5.2,<6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "mypy>=1.13",
    "ruff>=0.17.4",
    "types-requests>=2.33.0.20261030",
]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
# Skip files git ignores, such as local notes and scripts, as ruff does.
exclude_gitignore = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "*.tests"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff.lint]
# Django declares options as class attributes holding lists (Meta.ordering,
# choices, a migration's operations), which RUF012 would flag in every app.
ignore = ["RUF012"]
